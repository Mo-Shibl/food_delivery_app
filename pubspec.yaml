name: food_delivery_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cached_network_image:
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio:
  equatable:
  flutter:
    sdk: flutter
  flutter_bloc:
  flutter_svg: ^2.0.10
  freezed_annotation:
  get_it:
  json_annotation:
  pretty_dio_logger:
  shared_preferences:
  skeletonizer: ^2.1.3

dev_dependencies:
  build_runner:
  flutter_lints:
  flutter_test:
    sdk: flutter
  freezed:
  json_serializable:

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: League Spartan
      fonts:
        - asset: assets/fonts/LeagueSpartan-Light.ttf
          weight: 300
        - asset: assets/fonts/LeagueSpartan-Medium.ttf
          weight: 500
        - asset: assets/fonts/LeagueSpartan-Bold.ttf
          weight: 700